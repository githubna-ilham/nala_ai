<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>NALA — Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>NALA — Nusantara Assistant</h1>
        <nav><a href="/">Chat</a> | <a href="/upload">Knowledge Base</a> | <a href="/data-operasional">Data Operasional</a></nav>
        <div class="chat-meta">
            <span id="message-count">0 pesan</span>
            <span id="windowing-note" hidden>— windowing aktif, hanya 10 pesan terakhir dikirim ke NALA</span>
            <button id="reset-btn" type="button">Mulai percakapan baru</button>
        </div>
        <div id="history"></div>
        <label class="rag-toggle">
            <input type="checkbox" id="useRagToggle" checked>
            Pakai RAG (cari dari dokumen)
        </label>
        <fieldset class="search-method-select">
            <legend>Metode pencarian (centang keduanya = Hybrid):</legend>
            <label><input type="checkbox" id="bm25Toggle" checked> BM25 (kata kunci)</label>
            <label><input type="checkbox" id="vectorToggle" checked> Vector (makna)</label>
        </fieldset>
        <label class="rerank-toggle">
            <input type="checkbox" id="useRerankingToggle" checked>
            Rerank hasil (cross-encoder)
        </label>
        <label class="agent-toggle">
            <input type="checkbox" id="agentModeToggle">
            Pakai Agent (RAG + SQL tool)
        </label>
        <form id="chat-form">
            <input type="text" id="message" placeholder="Tanya NALA seputar SOP..." required>
            <button type="submit">Kirim</button>
        </form>
    </div>
    <script>
        const form = document.getElementById("chat-form");
        const history = document.getElementById("history");
        const input = document.getElementById("message");
        const submitBtn = form.querySelector("button[type=submit]");

        let conversation = [];

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function updateMeta() {
            document.getElementById("message-count").textContent = `${conversation.length} pesan`;
            document.getElementById("windowing-note").hidden = conversation.length <= 8;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = input.value;
            input.value = "";

            conversation.push({ role: "user", content: message });
            history.innerHTML += `<p class="user"><b>Anda:</b> ${escapeHtml(message)}</p>`;
            const replyEl = document.createElement("p");
            replyEl.className = "nala";
            replyEl.innerHTML = `<b>NALA:</b> <span class="typing">sedang mengetik<i></i><i></i><i></i></span>`;
            history.appendChild(replyEl);
            history.scrollTop = history.scrollHeight;

            // Kunci input selama menunggu balasan, cegah kirim ganda.
            submitBtn.disabled = true;
            input.disabled = true;

            const agentMode = document.getElementById("agentModeToggle").checked;
            const useRag = document.getElementById("useRagToggle").checked;
            const bm25On = document.getElementById("bm25Toggle").checked;
            const vectorOn = document.getElementById("vectorToggle").checked;
            let searchMethod = "hybrid";  // keduanya dicentang ATAU keduanya kosong
            if (bm25On && !vectorOn) searchMethod = "bm25";
            else if (vectorOn && !bm25On) searchMethod = "vector";
            const useReranking = document.getElementById("useRerankingToggle").checked;

            try {
                let fullReply = "";
                if (agentMode) {
                    // Mode Agent: POST /chat (non-stream), agent memutuskan tool sendiri.
                    const agentHistory = conversation.slice(0, -1);
                    const response = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message, history: agentHistory }),
                    });
                    const data = await response.json();
                    fullReply = data.reply;
                    replyEl.innerHTML = `<b>NALA:</b> ${escapeHtml(fullReply)}`;
                    history.scrollTop = history.scrollHeight;
                } else {
                    const response = await fetch("/chat/stream", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ messages: conversation, use_rag: useRag, search_method: searchMethod, use_reranking: useReranking }),
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        // Token pertama otomatis menimpa indikator "sedang mengetik".
                        fullReply += decoder.decode(value, { stream: true });
                        replyEl.innerHTML = `<b>NALA:</b> ${escapeHtml(fullReply)}`;
                        history.scrollTop = history.scrollHeight;
                    }
                }

                conversation.push({ role: "assistant", content: fullReply });
                updateMeta();
            } catch (err) {
                replyEl.innerHTML = `<b>NALA:</b> <span class="error">Gagal memuat balasan: ${escapeHtml(err.message)}</span>`;
            } finally {
                submitBtn.disabled = false;
                input.disabled = false;
                input.focus();
            }
        });

        document.getElementById("reset-btn").addEventListener("click", () => {
            if (!confirm("Mulai percakapan baru? Riwayat saat ini akan hilang.")) return;
            conversation = [];
            history.innerHTML = "";
            updateMeta();
        });

        // Mode Agent memutuskan retrieval sendiri — nonaktifkan kontrol retrieval lama saat aktif.
        const RETRIEVAL_TOGGLES = ["useRagToggle", "bm25Toggle", "vectorToggle", "useRerankingToggle"];
        document.getElementById("agentModeToggle").addEventListener("change", (e) => {
            RETRIEVAL_TOGGLES.forEach((id) => {
                document.getElementById(id).disabled = e.target.checked;
            });
        });
    </script>
</body>
</html>
