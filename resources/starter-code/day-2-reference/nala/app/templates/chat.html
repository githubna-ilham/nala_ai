<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>NALA — Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>NALA — Nusantara Assistant</h1>
        <nav><a href="/">Chat</a> | <a href="/upload">Knowledge Base</a></nav>
        <div id="conversation-info">
            <span id="message-count">0 pesan</span>
            <button type="button" id="reset-btn">Mulai percakapan baru</button>
        </div>
        <div id="history"></div>
        <form id="chat-form">
            <input type="text" id="message" placeholder="Tanya NALA seputar SOP..." required>
            <button type="submit">Kirim</button>
        </form>
    </div>
    <script>
        const form = document.getElementById("chat-form");
        const history = document.getElementById("history");
        const input = document.getElementById("message");
        const messageCount = document.getElementById("message-count");
        const resetBtn = document.getElementById("reset-btn");

        // Riwayat percakapan disimpan di memori browser saja (hilang saat reload) —
        // tidak ada penyimpanan di server, konsisten dengan desain stateless NALA.
        let conversation = [];

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMessageCount() {
            const n = conversation.length;
            let label = `${n} pesan`;
            if (n > 8) {
                label += " — windowing aktif, hanya 10 pesan terakhir dikirim ke NALA";
            }
            messageCount.textContent = label;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = input.value;
            input.value = "";

            conversation.push({ role: "user", content: message });
            history.innerHTML += `<p class="user"><b>Anda:</b> ${escapeHtml(message)}</p>`;
            renderMessageCount();

            const replyEl = document.createElement("p");
            replyEl.className = "nala";
            replyEl.innerHTML = "<b>NALA:</b> ";
            history.appendChild(replyEl);
            history.scrollTop = history.scrollHeight;

            const response = await fetch("/chat/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: conversation }),
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullReply = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                fullReply += decoder.decode(value, { stream: true });
                replyEl.innerHTML = `<b>NALA:</b> ${escapeHtml(fullReply)}`;
                history.scrollTop = history.scrollHeight;
            }

            conversation.push({ role: "assistant", content: fullReply });
            renderMessageCount();
        });

        resetBtn.addEventListener("click", () => {
            if (!confirm("Hapus seluruh riwayat percakapan? Tindakan ini tidak bisa dibatalkan.")) {
                return;
            }
            conversation = [];
            history.innerHTML = "";
            renderMessageCount();
        });
    </script>
</body>
</html>
